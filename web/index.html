<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-crew</title>
<!-- Drawn inline: nothing to fetch, and nothing for the browser to 404 on when
     it asks for /favicon.ico by itself. Someone at a desk. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23201d19'/><circle cx='16' cy='12' r='4.5' fill='%23efe7db'/><rect x='5' y='19' width='22' height='4' rx='1.5' fill='%23f0b45a'/></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="update-bar" class="update-bar" hidden role="status">
  <span id="update-text"></span>
  <button type="button" id="update-apply" class="tiny">받기</button>
  <button type="button" id="update-hide" class="ghost tiny">나중에</button>
</div>

<div class="app">

  <!-- 왼쪽 = 사무실 그래픽(위) + 상태 섹션들(아래). 오른쪽 = 대화창. -->
  <main class="col main-area">
    <div class="stage">
      <!-- viewport shrink-wraps the canvas so nameplate coordinates are
           relative to the artwork, not to the centred stage -->
      <div class="viewport">
        <canvas id="office"></canvas>
        <div id="nameplates"></div>
      </div>
    </div>
    <div class="hint" id="hint" role="status" hidden></div>

    <!-- 상태 띠 높이 조절 손잡이 (위아래 드래그 · 방향키 · 더블클릭으로 되돌리기) -->
    <div id="deck-resize" class="resizer-h" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="상태 섹션 높이" title="끌어서 높이 조절 · 더블클릭하면 원래대로"></div>

    <!-- 상태 섹션들 — 넓고 낮은 자리라 세로로 쌓지 않고 나란히 세운다.
         가로로 길어지므로 양 끝으로 데려다 주는 화살표를 띄워 둔다. -->
    <div class="deck-wrap">
      <button type="button" id="deck-prev" class="deck-arrow prev" aria-label="맨 앞으로" hidden>◀</button>
      <button type="button" id="deck-next" class="deck-arrow next" aria-label="맨 끝으로" hidden>▶</button>
    <div class="deck" id="deck">
      <section class="panel">
        <h2>남은 한도</h2>
        <div id="usage" class="usage"><p class="muted">확인 중…</p></div>
      </section>

      <!-- 설명은 제목 옆 ? 에 접어 뒀습니다 — 올려 두면 보입니다 (main.js) -->
      <section class="panel" id="today-panel" hidden>
        <h2>오늘<button type="button" class="help" data-help="할 일을 사무실 구역에 끌어다 놓으면 그 이름의 창 그룹이 됩니다.">?</button></h2>
        <div id="tasks" class="tasks"></div>
      </section>

      <section class="panel" id="jobs-panel" hidden>
        <h2>자주 하는 일<button type="button" class="help" data-help="눌러서 매뉴얼을 보고, 사람에게 끌어다 놓으면 설명 없이 시작합니다.">?</button></h2>
        <div id="jobs" class="jobs"></div>
      </section>

      <section class="panel" id="windows-panel" hidden>
        <h2>내 창<button type="button" class="help" data-help="한 가지 일에 쓰는 창들을 한 테이블에 모아 두면, 그 일을 시작할 때 한 번에 열고 끝나면 한 번에 치울 수 있습니다. 사람을 끌어다 옮기세요.">?</button></h2>
        <button type="button" id="group-new" class="ghost tiny" hidden>새 그룹</button>
        <div id="windows-summary" class="system"></div>
      </section>

      <section class="panel" id="saved-panel" hidden>
        <h2>저장된 그룹<button type="button" class="help" data-help="눌러서 그때 열려 있던 창들을 한 번에 다시 엽니다.">?</button></h2>
        <div id="saved" class="jobs"></div>
        <div class="row end">
          <button type="button" id="saved-all" class="ghost tiny" hidden>전체 보기</button>
        </div>
      </section>

      <section class="panel">
        <h2>기록</h2>
        <ul id="activity" class="activity"></ul>
      </section>
    </div>
    </div>
  </main>

  <!-- 대화창 너비 조절 손잡이 (좌우 드래그 · 방향키 · 더블클릭으로 되돌리기) -->
  <div id="chat-resize" class="resizer" role="separator" aria-orientation="vertical"
       aria-label="대화창 너비" tabindex="0" title="끌어서 대화창 너비 조절 · 더블클릭하면 원래대로"></div>

  <aside class="col right">
    <section class="panel approvals-panel" id="approvals-panel" hidden>
      <h2>승인 기다리는 중</h2>
      <div id="approvals"></div>
    </section>

    <section class="panel chat-panel grow" id="chat-panel">
      <!-- 파일을 대화창 아무 데나 끌어다 놓으면 첨부됩니다 -->
      <div class="drop-veil" id="drop-veil" hidden aria-hidden="true">
        <div class="drop-veil__box">
          <b>여기에 놓으세요</b>
          <small>이 사람의 작업 폴더로 옮기고, 경로를 알려줍니다</small>
        </div>
      </div>
      <div class="chat-head">
        <h2 id="chat-title">대화</h2>
        <small id="version"></small>
        <button type="button" id="open-types" class="ghost tiny" title="유형과 스킬 편집">유형</button>
      </div>
      <div id="chat" class="chat">
        <p class="muted empty">사람을 고르면 여기서 대화합니다.</p>
      </div>
      <form id="composer" class="composer" hidden>
        <div class="toggles">
          <label class="watch">
            <input type="checkbox" id="watch">
            <span>작업 과정 지켜보기</span>
          </label>
          <label class="watch">
            <input type="checkbox" id="trust">
            <span>알아서 하게 두기</span>
          </label>
        </div>
        <!-- 이 사람만의 모델·생각 깊이. 바꾸면 같은 대화에 그대로 이어 붙습니다. -->
        <div class="tuning">
          <label><span>모델</span><select id="tune-model"></select></label>
          <label><span>생각 깊이</span><select id="tune-effort"></select></label>
          <small id="tune-note" class="tune-note"></small>
        </div>
        <div id="attachments" class="attachments"></div>
        <div class="row">
          <textarea id="prompt" rows="2" placeholder="시킬 일을 적으세요.  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
          <button type="submit" id="send">보내기</button>
        </div>
        <div class="row end">
          <label class="ghost tiny file-btn">
            파일 붙이기
            <input type="file" id="files" multiple hidden>
          </label>
          <button type="button" id="dismiss" class="ghost tiny">끝내고 내보내기</button>
        </div>
      </form>
    </section>
  </aside>

</div>

<!-- 끌고 있는 카드는 손끝을 그대로 따라다닙니다 (main.js startCardDrag) -->
<div id="drag-layer" aria-hidden="true"></div>

<!-- 문 앞에서 손을 놓았을 때 -->
<div id="leave" class="modal" hidden>
  <div class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="leave-title">
    <h3 id="leave-title">이 세션을 정말 종료하시나요?</h3>
    <p class="leave-note">나간 사람은 다시 돌아오지 않아요.</p>
    <p class="hint-sm" id="leave-who"></p>
    <div class="sheet-actions">
      <button type="button" id="leave-no" class="ghost">아니요</button>
      <button type="button" id="leave-yes">예</button>
    </div>
  </div>
</div>

<!-- 그룹 하나 — 무슨 창이 들어 있는지, 이름, 저장·삭제 -->
<div id="group" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="group-title">
    <h3 id="group-title">그룹</h3>
    <label class="field">
      <span>이 그룹의 이름 (하는 일)</span>
      <input type="text" id="group-name" class="line-input" maxlength="40" autocomplete="off">
    </label>
    <div id="group-list" class="win-list"></div>
    <p class="hint-sm" id="group-note"></p>
    <div class="sheet-actions">
      <button type="button" id="group-delete" class="ghost tiny danger">그룹 없애기</button>
      <button type="button" id="group-close" class="ghost">닫기</button>
      <button type="button" id="group-save">저장하기</button>
    </div>
  </div>
</div>

<!-- 저장된 그룹 전체 -->
<div id="saved-list" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="saved-list-title">
    <h3 id="saved-list-title">저장된 그룹</h3>
    <div id="saved-all-list" class="win-list"></div>
    <div class="sheet-actions">
      <button type="button" id="saved-list-close" class="ghost">닫기</button>
    </div>
  </div>
</div>

<!-- 자주 하는 일의 매뉴얼 — 지금까지 이 일을 하며 쌓인 지침 -->
<div id="manual" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="manual-title">
    <h3 id="manual-title">매뉴얼</h3>
    <p class="hint-sm" id="manual-sub"></p>
    <div id="manual-body" class="manual-body"></div>
    <textarea id="manual-edit" class="manual-edit" rows="12" spellcheck="false" hidden
      placeholder="이 일을 할 때 지켜야 하는 것들을 적어 두세요. 다음 사람이 그대로 읽습니다."></textarea>
    <div class="sheet-actions">
      <button type="button" id="manual-editor" class="ghost tiny">지침 고치기</button>
      <button type="button" id="manual-close" class="ghost">닫기</button>
      <button type="button" id="manual-save" hidden>저장</button>
    </div>
  </div>
</div>

<!-- 유형 고르기 -->
<div id="hire" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hire-title">
    <h3 id="hire-title">누구를 부를까요?</h3>
    <div id="persona-list" class="persona-list"></div>
    <label class="watch">
      <input type="checkbox" id="hire-watch">
      <span>작업 과정 지켜보기 — 브라우저 작업을 눈앞에 띄웁니다</span>
    </label>
    <div class="sheet-actions">
      <button type="button" id="hire-cancel" class="ghost">취소</button>
    </div>
  </div>
</div>

<!-- 유형·스킬 편집 -->
<div id="types" class="modal" hidden>
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="types-title">
    <h3 id="types-title">유형과 스킬</h3>
    <p class="hint-sm">여기서 고친 내용은 <b>다음에 부르는 사람부터</b> 적용됩니다.</p>
    <div class="types-body">
      <nav id="type-tabs" class="type-tabs"></nav>
      <div class="type-editor">
        <!-- 이 유형을 부를 때 기본으로 쓰는 값. 부른 뒤에는 사람마다 따로 바꿀 수 있습니다. -->
        <div class="type-defaults">
          <label class="field"><span>기본 모델</span><select id="type-model"></select></label>
          <label class="field"><span>기본 생각 깊이</span><select id="type-effort"></select></label>
        </div>
        <label class="field">
          <span>이 유형의 성격 (system.md)</span>
          <textarea id="type-system" rows="10" spellcheck="false"></textarea>
        </label>
        <div class="skills-head">
          <span>스킬</span>
          <select id="skill-pick"></select>
          <button type="button" id="skill-new" class="ghost tiny">새 스킬</button>
          <button type="button" id="skill-del" class="ghost tiny">삭제</button>
        </div>
        <textarea id="skill-body" rows="12" spellcheck="false"
          placeholder="---&#10;name: 스킬-이름&#10;description: 언제 이 스킬을 쓰는지 — 이 문장을 보고 사람이 스스로 꺼내 씁니다.&#10;---&#10;&#10;## 어떻게 하는지"></textarea>
      </div>
    </div>
    <div class="sheet-actions">
      <span id="type-saved" class="saved"></span>
      <button type="button" id="types-close" class="ghost">닫기</button>
      <button type="button" id="types-save">저장</button>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
