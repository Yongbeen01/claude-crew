<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-crew</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="update-bar" class="update-bar" hidden>
  <span id="update-text"></span>
  <button type="button" id="update-apply" class="tiny">받기</button>
  <button type="button" id="update-hide" class="ghost tiny">나중에</button>
</div>

<div class="app">

  <aside class="col left">
    <header class="brand">
      <span class="logo"></span>
      <div>
        <b>claude-crew</b>
        <small id="version"></small>
      </div>
      <button type="button" id="open-types" class="ghost tiny" title="유형과 스킬 편집">유형</button>
    </header>

    <section class="panel">
      <h2>남은 한도</h2>
      <div id="usage" class="usage"><p class="muted">확인 중…</p></div>
    </section>

    <section class="panel" id="today-panel" hidden>
      <h2>오늘</h2>
      <div id="tasks" class="tasks"></div>
    </section>

    <section class="panel" id="jobs-panel" hidden>
      <h2>자주 하는 일</h2>
      <p class="hint-sm">카드를 사람에게 끌어다 놓으면 설명 없이 그 일을 시작합니다.</p>
      <div id="jobs" class="jobs"></div>
    </section>

    <section class="panel">
      <h2>이 컴퓨터</h2>
      <div id="system" class="system"></div>
    </section>

    <section class="panel grow">
      <h2>기록</h2>
      <ul id="activity" class="activity"></ul>
    </section>
  </aside>

  <main class="col center">
    <div class="stage">
      <!-- viewport shrink-wraps the canvas so nameplate coordinates are
           relative to the artwork, not to the centred stage -->
      <div class="viewport">
        <canvas id="office"></canvas>
        <div id="nameplates"></div>
      </div>
    </div>
    <div class="hint" id="hint">빈 책상을 누르면 사람을 부릅니다.</div>
  </main>

  <aside class="col right">
    <section class="panel approvals-panel" id="approvals-panel" hidden>
      <h2>승인 기다리는 중</h2>
      <div id="approvals"></div>
    </section>

    <section class="panel chat-panel grow">
      <h2 id="chat-title">대화</h2>
      <div id="chat" class="chat">
        <p class="muted empty">사람을 고르면 여기서 대화합니다.</p>
      </div>
      <form id="composer" class="composer" hidden>
        <div class="toggles">
          <label class="watch">
            <input type="checkbox" id="watch">
            <span>작업 과정 지켜보기</span>
          </label>
          <label class="watch">
            <input type="checkbox" id="trust">
            <span>알아서 하게 두기</span>
          </label>
        </div>
        <div id="attachments" class="attachments"></div>
        <div class="row">
          <textarea id="prompt" rows="2" placeholder="시킬 일을 적으세요.  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
          <button type="submit" id="send">보내기</button>
        </div>
        <div class="row end">
          <label class="ghost tiny file-btn">
            파일 붙이기
            <input type="file" id="files" multiple hidden>
          </label>
          <button type="button" id="dismiss" class="ghost tiny">퇴근시키기</button>
        </div>
      </form>
    </section>
  </aside>

</div>

<!-- 유형 고르기 -->
<div id="hire" class="modal" hidden>
  <div class="sheet">
    <h3>누구를 부를까요?</h3>
    <div id="persona-list" class="persona-list"></div>
    <label class="watch">
      <input type="checkbox" id="hire-watch">
      <span>작업 과정 지켜보기 — 브라우저 작업을 눈앞에 띄웁니다</span>
    </label>
    <div class="sheet-actions">
      <button type="button" id="hire-cancel" class="ghost">취소</button>
    </div>
  </div>
</div>

<!-- 유형·스킬 편집 -->
<div id="types" class="modal" hidden>
  <div class="sheet wide">
    <h3>유형과 스킬</h3>
    <p class="hint-sm">여기서 고친 내용은 <b>다음에 부르는 사람부터</b> 적용됩니다.</p>
    <div class="types-body">
      <nav id="type-tabs" class="type-tabs"></nav>
      <div class="type-editor">
        <label class="field">
          <span>이 유형의 성격 (system.md)</span>
          <textarea id="type-system" rows="10" spellcheck="false"></textarea>
        </label>
        <div class="skills-head">
          <span>스킬</span>
          <select id="skill-pick"></select>
          <button type="button" id="skill-new" class="ghost tiny">새 스킬</button>
          <button type="button" id="skill-del" class="ghost tiny">삭제</button>
        </div>
        <textarea id="skill-body" rows="12" spellcheck="false"
          placeholder="---&#10;name: 스킬-이름&#10;description: 언제 이 스킬을 쓰는지 — 이 문장을 보고 사람이 스스로 꺼내 씁니다.&#10;---&#10;&#10;## 어떻게 하는지"></textarea>
      </div>
    </div>
    <div class="sheet-actions">
      <span id="type-saved" class="saved"></span>
      <button type="button" id="types-close" class="ghost">닫기</button>
      <button type="button" id="types-save">저장</button>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
